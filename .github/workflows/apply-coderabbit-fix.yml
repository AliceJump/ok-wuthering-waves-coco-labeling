name: Apply targeted CodeRabbit fix

on:
  push:
    branches:
      - "fix/preserve-missing-referenced-target-image"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-missing-referenced-target-image
          fetch-depth: 0
      - name: Apply fix
        run: python .github/apply_coderabbit_fix.py
      - name: Test
        run: python -m unittest scripts/sync/test_semantic_coco_merge.py -v
      - name: Commit
        run: |
          git rm .github/workflows/apply-coderabbit-fix.yml .github/apply_coderabbit_fix.py
          git add scripts/sync/semantic_coco_merge.py scripts/sync/test_semantic_coco_merge.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve referenced target image state"
          git push origin HEAD:fix/preserve-missing-referenced-target-image
