name: Temporary assemble labeling-source semantics
on:
  push:
    branches:
      - feature/source-labeling-semantic-audit
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            .merge-tmp
            scripts/sync
          sparse-checkout-cone-mode: false
      - name: Assemble permanent files
        run: |
          set -euo pipefail
          cat .merge-tmp/resolver.1 .merge-tmp/resolver.2 .merge-tmp/resolver.3 > scripts/sync/semantic_coco_merge.py
          cat .merge-tmp/test.1 .merge-tmp/test.2 > scripts/sync/test_semantic_coco_merge.py
          chmod +x scripts/sync/semantic_coco_merge.py
      - name: Run semantic merge tests
        run: python -m unittest scripts/sync/test_semantic_coco_merge.py -v
      - name: Commit assembled files
        run: |
          set -euo pipefail
          rm -rf .merge-tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align merge audit with labeling source semantics"
          git push origin HEAD:feature/source-labeling-semantic-audit
