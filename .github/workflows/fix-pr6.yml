name: Resolve PR 6 conflict

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.issue.title == 'trigger-pr6-resolver'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream and rebuild Lingyang annotation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AliceJump"
          git config user.email "149395013+AliceJump@users.noreply.github.com"
          git remote add upstream https://github.com/ok-oldking/ok-wuthering-waves-coco-labeling.git || true
          git fetch upstream master

          test -f QQ20260830-103805.png
          cp QQ20260830-103805.png /tmp/lingyang.png

          set +e
          git merge --no-commit --no-ff upstream/master
          merge_status=$?
          set -e
          echo "merge status: ${merge_status}"

          git checkout upstream/master -- coco_annotations.json
          cp /tmp/lingyang.png QQ20260830-103805.png

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("coco_annotations.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          image_id = 41
          annotation_id = 440
          category_id = 287

          assert image_id not in {x["id"] for x in data["images"]}
          assert annotation_id not in {x["id"] for x in data["annotations"]}
          assert category_id not in {x["id"] for x in data["categories"]}
          assert "char_lingyang" not in {x["name"] for x in data["categories"]}

          data["images"].append({
              "id": image_id,
              "file_name": "QQ20260830-103805.png",
              "width": 2560,
              "height": 1440,
          })
          data["annotations"].append({
              "id": annotation_id,
              "image_id": image_id,
              "category_id": category_id,
              "bbox": [2355, 304, 62, 52],
              "area": 3224,
              "iscrowd": 0,
          })
          data["categories"].append({
              "id": category_id,
              "name": "char_lingyang",
              "supercategory": "",
          })

          data["images"].sort(key=lambda x: x["id"])
          data["annotations"].sort(key=lambda x: x["id"])
          data["categories"].sort(key=lambda x: x["id"])

          assert len({x["id"] for x in data["images"]}) == len(data["images"])
          assert len({x["id"] for x in data["annotations"]}) == len(data["annotations"])
          assert len({x["id"] for x in data["categories"]}) == len(data["categories"])

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

          rm -f .github/workflows/fix-pr6.yml
          git add -A
          git status --short
          git commit -m "Merge latest upstream and resolve Lingyang annotation IDs"
          git push origin HEAD:master
